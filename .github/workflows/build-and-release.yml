name: Build & Release (on peditxos-passwall)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.5.1)'
        required: true
        type: string
      targets:
        description: 'Target arches (comma-separated: x86_64,aarch64_cortex-a53,...)'
        required: true
        default: 'x86_64,aarch64_cortex-a53'
      openwrt_version:
        description: 'OpenWrt version (24.10 or 25.12)'
        required: true
        default: '25.12'

# Permissions: needs contents:write for creating releases, id-token:write for OIDC
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build for ${{ matrix.target }} (OpenWrt ${{ matrix.openwrt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            openwrt: '25.12'
          - target: aarch64_cortex-a53
            openwrt: '25.12'
          - target: x86_64
            openwrt: '24.10'
          - target: aarch64_cortex-a53
            openwrt: '24.10'
        # Filter by workflow_dispatch inputs if provided
    steps:
      - name: Checkout source (peditx/peditxos-aigate)
        uses: actions/checkout@v4
        with:
          repository: peditx/peditxos-aigate
          token: ${{ secrets.PEDITX_PAT }}  # PAT with repo access on peditx

      - name: Set up OpenWrt SDK (${{ matrix.openwrt }})
        uses: openwrt/gh-action-sdk@v1
        with:
          version: ${{ matrix.openwrt }}
          target: ${{ matrix.target }}

      - name: Install package dependencies
        run: |
          ./scripts/feeds update luci
          ./scripts/feeds install -p luci luci-app-aigate

      - name: Build package
        run: |
          make package/luci-app-aigate/compile V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: Collect artifacts
        id: artifacts
        run: |
          PKG_DIR="bin/packages/${{ matrix.target }}/luci"
          echo "pkg_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          find "$PKG_DIR" -name 'luci-app-aigate_*.apk' -o -name 'luci-app-aigate_*.ipk' | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-aigate-${{ matrix.openwrt }}-${{ matrix.target }}
          path: ${{ steps.artifacts.outputs.pkg_dir }}/luci-app-aigate_*.{apk,ipk}
          retention-days: 7

  release:
    name: Create Release on peditx/peditxos-aigate
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: luci-app-aigate-*
          merge-multiple: true

      - name: Prepare release assets
        id: prep
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "name=PeDItXOS-AiGate v$VERSION" >> $GITHUB_OUTPUT
          # Generate checksums
          find . -name '*.apk' -o -name '*.ipk' | sort | xargs sha256sum > SHA256SUMS.txt
          echo "checksums=$(cat SHA256SUMS.txt)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (on peditx/peditxos-aigate)
        uses: softprops/action-gh-release@v2
        with:
          repository: peditx/peditxos-aigate
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.name }}
          body: |
            ## PeDItXOS-AiGate v${{ github.event.inputs.version }}

            ### Install
            \`\`\`sh
            # On OpenWrt 25.12 (apk)
            apk add --allow-untrusted luci-app-aigate-<version>-<arch>.apk

            # On OpenWrt 24.10 (opkg)
            opkg install luci-app-aigate_<version>_<arch>.ipk
            \`\`\`

            ### Checksums
            \`\`\`
            ${{ steps.prep.outputs.checksums }}
            \`\`\`

            Built from commit ${{ github.sha }} on OpenWrt ${{ github.event.inputs.openwrt_version }}.
          files: |
            **/*.apk
            **/*.ipk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.PEDITX_PAT }}

